<!DOCTYPE html>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Guía Rápida de Medicamentos - Estudio</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 12px;
            color: #2c3e50;
            -webkit-tap-highlight-color: transparent;
        }

        header {
            text-align: center;
            margin-top: 10px;
            margin-bottom: 20px;
            padding: 0 10px;
        }

        h1 {
            margin: 0;
            color: #1a252f;
            font-size: clamp(1.4em, 5vw, 2em);
        }

        p.subtitle {
            color: #7f8c8d;
            margin-top: 4px;
            font-size: clamp(0.85em, 3vw, 1em);
        }

        /* --- Panel de Repaso / Modo Aleatorio --- */
        .random-container {
            max-width: 600px;
            margin: 0 auto 25px auto;
            text-align: center;
            padding: 0 5px;
        }

        .btn-random {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 1em;
            font-weight: 700;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(39, 174, 96, 0.3);
            transition: transform 0.15s ease, background-color 0.15s ease;
            width: 100%;
            max-width: 320px;
            touch-action: manipulation;
        }

        .btn-random:active {
            transform: scale(0.97);
            background-color: #219150;
        }

        .random-card {
            display: none;
            background-color: #ffffff;
            border: 2px solid #27ae60;
            border-radius: 12px;
            padding: 20px 16px;
            margin-top: 16px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
            animation: fadeIn 0.25s ease-out;
            position: relative;
            text-align: left;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .random-card .categoria-tag {
            display: inline-block;
            background-color: #e8f8f5;
            color: #16a085;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.8em;
            font-weight: bold;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .random-card .med-title {
            font-size: 1.35em;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 6px;
            padding-right: 25px;
        }

        .random-card .med-uso {
            font-size: 1em;
            color: #7f8c8d;
            line-height: 1.4;
        }

        .btn-close {
            position: absolute;
            top: 12px;
            right: 12px;
            background: #f0f3f4;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 1.1em;
            color: #7f8c8d;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-close:active {
            background-color: #e74c3c;
            color: #ffffff;
        }

        /* --- Grid Responsivo --- */
        .grid-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .card {
            background-color: #ffffff;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.04);
            border: 1px solid #e1e8ed;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .card-header {
            background-color: #34495e;
            color: #ffffff;
            padding: 12px 14px;
            font-size: 1em;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
            user-select: none;
        }

        .card-body {
            padding: 8px 14px;
            flex-grow: 1;
        }

        .med-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .med-item {
            padding: 10px 0;
            border-bottom: 1px solid #ecf0f1;
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            font-size: 0.9em;
        }

        .med-item:last-child {
            border-bottom: none;
        }

        .med-nombre {
            font-weight: 600;
            color: #2c3e50;
            flex-shrink: 0;
            max-width: 55%;
            word-wrap: break-word;
        }

        .med-indicacion {
            color: #7f8c8d;
            font-size: 0.88em;
            text-align: right;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 4px;
        }

        .arrow {
            color: #bdc3c7;
            font-size: 0.9em;
        }

        /* --- Media Queries --- */
        @media (min-width: 600px) {
            body {
                padding: 20px;
            }

            .grid-container {
                grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
                gap: 20px;
            }

            .random-card {
                padding: 20px;
            }

            .med-item {
                font-size: 0.95em;
            }
        }
    </style>
</head>
